name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Text snapshots make any public API movement explicit in code review. An
  # intentional pre-1.0 break is acknowledged by reviewing and committing the
  # regenerated snapshots alongside its migration and release notes.
  public-api:
    name: Public API Snapshot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.52.0

      - name: Test snapshot validation
        run: python3 -m unittest scripts.tests.test_public_api

      - name: Check public API snapshots
        run: python3 scripts/public_api.py check

  # After the dependency audit in #448, cargo-machete is a fast, deterministic
  # gate. Generated-code/build-script false positives are documented narrowly
  # in the owning manifest rather than hidden by a workspace-wide allowlist.
  dependency-hygiene:
    name: Dependency Hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      - name: Check unused dependencies
        run: cargo machete --with-metadata

  # This packages every publishable crate in dependency order without
  # publishing it. Running on every PR necessarily gates release-plz PRs while
  # also catching package-surface regressions when they are introduced.
  publish-preflight:
    name: Publish Preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test preflight validation
        run: python3 -m unittest scripts.tests.test_publish_preflight

      - name: Inspect publishable package archives
        run: python3 scripts/publish_preflight.py

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # The tonic-resilient-greeter workspace example (#388: audited, kept,
      # and rewritten to use real tower-resilience middleware) compiles
      # protobufs from source (see examples/tonic-resilient-greeter/build.rs),
      # and tests/examples_smoke.rs builds and runs it as part of the
      # integration-tests step below. Cross-platform install since this
      # job's matrix spans ubuntu/macos/windows; see the protoc note on the
      # clippy job (#419) for why this isn't apt-get.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        timeout-minutes: 5
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run library tests
        run: cargo test --locked --lib --workspace --all-features

      - name: Run integration tests
        run: cargo test --locked --test '*' --workspace --all-features

      - name: Run doctests
        run: cargo test --locked --doc --workspace --all-features

      - name: Build all examples
        run: cargo build --locked --examples --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The tonic-resilient-greeter workspace example (#388: audited, kept,
      # and rewritten to use real tower-resilience middleware) compiles
      # protobufs from source. Installed from GitHub releases rather than
      # apt: untimed apt-get here stalled CI for 30-70 minutes on four runs
      # on 2026-08-18 (#419). The step timeout bounds any residual hang.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        timeout-minutes: 5
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Validates the published-crate MSRV (declared in [workspace.package]
      # rust-version). This pins the toolchain to the declared floor so the
      # advertised MSRV can't silently drift. Scope note: this checks the
      # publishable surface only (`-p tower-resilience --all-features`, all
      # edition 2021), NOT the repo-root `tower-resilience-tests` harness,
      # which is edition 2024 (publish = false) and is not part of the MSRV
      # contract.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --locked -p tower-resilience --all-features

  contract-lints:
    name: Source Contract Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catches the clone-in-call anti-pattern that violates Tower's Service
      # contract (#286). The Service contract permits `call` to panic if
      # invoked on an instance whose `poll_ready` was not driven to
      # `Poll::Ready(Ok(()))`. Cloning self.inner in call() and moving the
      # unreadied clone into the future violates this for any compliant
      # stateful inner middleware (tower::limit::ConcurrencyLimit,
      # tower::buffer::Buffer, tower::load_shed::LoadShed, etc.). The
      # contract-compliant form uses `std::mem::replace` so the readied
      # original moves into the future and a fresh clone stays on &mut self.
      #
      # See https://docs.rs/tower-service/0.3.3/tower_service/trait.Service.html#be-careful-when-cloning-inner-services
      - name: Forbid clone-in-call anti-pattern
        run: |
          if git grep -nE 'let mut [a-zA-Z_][a-zA-Z0-9_]* = self\.inner\.clone\(\);' -- 'crates/**/*.rs'; then
            echo ""
            echo "Found clone-in-call anti-pattern (#286). Use std::mem::replace instead:"
            echo "  let clone = self.inner.clone();"
            echo "  let mut inner = std::mem::replace(&mut self.inner, clone);"
            exit 1
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # See the protoc note on the clippy job (#419, #388).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        timeout-minutes: 5
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Scans Cargo.lock against the current RustSec advisory database and
      # fails on vulnerabilities. Non-fatal informational warnings may still
      # be reported by cargo-audit; do not add `--ignore` flags for actionable
      # vulnerabilities. If an advisory has no compatible fix, document the
      # risk and rationale next to a narrowly scoped exception.
      - name: Run cargo audit
        run: cargo audit
